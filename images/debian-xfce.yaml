apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: debian-xfce
  annotations:
    catalog.kubeworkspaces.io/example: "true"
spec:
  displayName: Debian Desktop XFCE
  description: Debian Linux virtual machine with a lightweight XFCE desktop,
    accessible via the graphical VNC display console. The root disk is a
    persistent DataVolume (CDI registry import), so the desktop and any changes
    survive restarts. XFCE is installed by cloud-init on first boot and uses 4Gi
    of memory by default. Supports fluid display resize (the guest follows the
    console window size).
  category: Desktop
  tags:
  - vm
  - linux
  - debian
  - desktop
  - gui
  - xfce
  defaultPort: 22
  homepageURL: https://www.debian.org
  image: quay.io/containerdisks/debian:13
  imageHomepageURL: https://quay.io/repository/containerdisks/debian
  sourceURL: https://github.com/kubevirt/containerdisks
  defaultUser: debian
  defaultPassword: debian
  defaultCloudInit: true
  defaultUserData: |
    #cloud-config
    ssh_pwauth: true
    chpasswd:
      expire: false
      list: |
        debian:debian
    package_update: true
    packages:
    - task-xfce-desktop
    - qemu-guest-agent
    write_files:
    # Autologin the default user straight into an XFCE session.
    - path: /etc/lightdm/lightdm.conf.d/50-autologin.conf
      permissions: "0644"
      content: |
        [Seat:*]
        user-session=xfce
        autologin-user=debian
        autologin-session=xfce
        autologin-user-timeout=0
        logind-check-graphical=false
    # Apply the virtio-gpu EDID preferred mode to the active X display. When
    # the VNC client resizes the window, QEMU processes SetDesktopSize and
    # updates the guest EDID; the new size becomes the first (preferred) mode
    # in /sys/class/drm/card0-*/modes. A tiny systemd service polls that file
    # and applies the new size with `xrandr --auto`. Polling (rather than a
    # udev RUN rule) avoids the uevent-storm races where concurrent handlers
    # could apply a stale size.
    - path: /usr/local/sbin/kw-display-resized
      permissions: "0755"
      content: |
        #!/bin/bash
        set -u
        POLL=0.5
        MODES=""
        find_modes() {
          MODES=$(ls /sys/class/drm/card0-*/modes 2>/dev/null | head -n1)
        }
        find_display() {
          local active_vt vtn
          active_vt=$(cat /sys/class/tty/tty0/active 2>/dev/null)
          vtn=""
          case "$active_vt" in tty*) vtn=${active_vt#tty} ;; esac
          DISPLAY_NUM=""
          if [ -n "$vtn" ]; then
            DISPLAY_NUM=$(ps -eo args= | grep "[X]org" | grep "vt$vtn" \
              | grep -oE ":[0-9]+" | head -n1)
          fi
          if [ -z "$DISPLAY_NUM" ]; then
            DISPLAY_NUM=$(ps -eo lstart=,args= 2>/dev/null | grep "[X]org" \
              | sort -k1,5 | tail -n1 | grep -oE ":[0-9]+" | head -n1)
          fi
          XAUTH=""
          if [ -n "$DISPLAY_NUM" ]; then
            XAUTH=$(ls /var/run/lightdm/root/ 2>/dev/null \
              | grep -F "$DISPLAY_NUM" | head -n1)
            [ -n "$XAUTH" ] || XAUTH=$(ls /var/run/lightdm/root/ 2>/dev/null \
              | tail -n1)
          fi
        }
        apply() {
          local preferred current
          preferred=$(head -n1 "$MODES" 2>/dev/null)
          [ -n "$preferred" ] || return 0
          find_display
          [ -n "$DISPLAY_NUM" ] && [ -n "$XAUTH" ] || return 0
          current=$(DISPLAY="$DISPLAY_NUM" \
            XAUTHORITY="/var/run/lightdm/root/$XAUTH" xrandr 2>/dev/null \
            | grep -oE 'current [0-9]+ x [0-9]+' | head -n1)
          if [ "$current" != "current ${preferred%x*} x ${preferred#*x}" ]; then
            DISPLAY="$DISPLAY_NUM" \
              XAUTHORITY="/var/run/lightdm/root/$XAUTH" \
              xrandr --output Virtual-1 --auto 2>/dev/null || true
          fi
        }
        last=""
        while true; do
          find_modes
          if [ -n "$MODES" ]; then
            cur=$(head -n1 "$MODES" 2>/dev/null)
            if [ -n "$cur" ] && [ "$cur" != "$last" ]; then
              sleep "$POLL"
              find_modes
              apply
              last=$(head -n1 "$MODES" 2>/dev/null)
            fi
          fi
          sleep "$POLL"
        done
    - path: /etc/systemd/system/kw-display-resize.service
      permissions: "0644"
      content: |
        [Unit]
        Description=Apply virtio-gpu EDID preferred mode to the active X display
        After=display-manager.service

        [Service]
        ExecStart=/usr/local/sbin/kw-display-resized
        Restart=always
        RestartSec=2

        [Install]
        WantedBy=multi-user.target
    runcmd:
    - systemctl set-default graphical.target
    - systemctl daemon-reload
    - systemctl enable --now kw-display-resize.service
  persistentRootDisk: true
  persistentRootDiskSize: 20Gi
  memoryLimit: 4Gi
  memoryRequest: 5Gi
  videoDevice: virtio
  workspaceTypes:
  - vm
