apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-xemu
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[xemu] is a free and open-source application that emulates the original Microsoft
    Xbox game console, enabling people to play their original Xbox games on Windows, macOS,
    and Linux systems.'
  category: Game
  tags:
  - linuxserver
  - linux
  - games
  displayName: xemu (LinuxServer)
  homepageURL: https://xemu.app/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/xemu-logo.png
  image: linuxserver/xemu:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/xemu
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-xemu
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
