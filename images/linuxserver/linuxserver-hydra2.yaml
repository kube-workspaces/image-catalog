apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-hydra2
spec:
  defaultPath: /
  defaultPort: 5076
  description: 'Legacy or infrastructure image available on Docker Hub. THIS IMAGE IS DEPRECATED.
    We will continue releases with a new image under the correct name: linuxserver/nzbhydra2.
    hydra2 is a meta search application for NZB indexers, the "spiritual successor" to NZBmegasearcH,
    and an evolution of the original application NZBHydra. It provides easy access to a number
    of raw and newznab based indexers. The application NZBHydra 2 is replacing NZBHydra 1
    and...'
  category: Tool
  tags:
  - linuxserver
  - linux
  - hub-only
  displayName: Hydra2 (LinuxServer)
  homepageURL: https://github.com/theotherp/nzbhydra2
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/hydra-icon.png
  image: linuxserver/hydra2:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/hydra2
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-hydra2
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
