apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-doc-builder
spec:
  defaultPath: /
  defaultPort: 80
  description: Legacy or infrastructure image available on Docker Hub. LinuxServer CI documentation
    build utility. No browser endpoint; use the terminal or native client.
  category: Tool
  tags:
  - linuxserver
  - linux
  - hub-only
  - cli
  displayName: Doc Builder (LinuxServer)
  homepageURL: https://hub.docker.com/r/linuxserver/doc-builder
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/linuxserver-ls-logo.png
  image: linuxserver/doc-builder:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/doc-builder
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-doc-builder
