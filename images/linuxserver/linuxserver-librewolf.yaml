apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-librewolf
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[LibreWolf] is a custom and independent version of Firefox, with the primary
    goals of privacy, security and user freedom. LibreWolf also aims to remove all the telemetry,
    data collection and annoyances, as well as disabling anti-freedom features like DRM.'
  category: Browser
  tags:
  - linuxserver
  - linux
  - web-browser
  displayName: LibreWolf (LinuxServer)
  homepageURL: https://librewolf.net/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/librewolf-logo.png
  image: linuxserver/librewolf:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/librewolf
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-librewolf
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
