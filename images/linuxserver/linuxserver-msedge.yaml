apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-msedge
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[Microsoft Edge] is a cross-platform web browser developed by Microsoft and
    based on Chromium.'
  category: Browser
  tags:
  - linuxserver
  - linux
  - web-browser
  displayName: Microsoft Edge (LinuxServer)
  homepageURL: https://www.microsoft.com/edge
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/edge-logo.png
  image: linuxserver/msedge:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/msedge
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-msedge
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
