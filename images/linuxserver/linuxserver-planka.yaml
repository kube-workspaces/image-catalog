apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-planka
spec:
  defaultPath: /
  defaultPort: 1337
  description: planka is an elegant open source project tracking tool.
  category: Tool
  tags:
  - linuxserver
  - linux
  - content-management
  - business
  displayName: Planka (LinuxServer)
  homepageURL: https://github.com/plankanban/planka/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/planka-logo.png
  image: linuxserver/planka:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/planka
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-planka
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
