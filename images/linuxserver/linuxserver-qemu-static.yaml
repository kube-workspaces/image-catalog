apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-qemu-static
spec:
  defaultPath: /
  defaultPort: 80
  description: Run multiple architectures of Docker containers on an x86_64 or aarch64 host
    using QEMU static. No browser endpoint; use the terminal or native client.
  category: Tool
  tags:
  - linuxserver
  - linux
  - docker
  - cli
  displayName: QEMU Static (LinuxServer)
  homepageURL: https://hub.docker.com/r/linuxserver/qemu-static
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/qemu-logo.png
  image: linuxserver/qemu-static:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/qemu-static
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-qemu-static
  privileged: true
