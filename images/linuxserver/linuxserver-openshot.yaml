apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-openshot
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[OpenShot] Video Editor is an award-winning free and open-source video editor
    for Linux, Mac, and Windows, and is dedicated to delivering high quality video editing
    and animation solutions to the world.'
  category: Tool
  tags:
  - linuxserver
  - linux
  - video-editor
  displayName: OpenShot (LinuxServer)
  homepageURL: https://openshot.org/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/openshot-logo.png
  image: linuxserver/openshot:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/openshot
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-openshot
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
