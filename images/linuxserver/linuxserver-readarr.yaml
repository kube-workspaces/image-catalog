apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-readarr
spec:
  defaultPath: /
  defaultPort: 8787
  description: Deprecated by LinuxServer.io. readarr - Book Manager and Automation (Sonarr
    for Ebooks)
  category: Tool
  tags:
  - linuxserver
  - linux
  - books
  - deprecated
  displayName: Readarr (LinuxServer)
  homepageURL: https://github.com/Readarr/Readarr
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/readarr-logo.png
  image: linuxserver/readarr:develop
  imageHomepageURL: https://hub.docker.com/r/linuxserver/readarr
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-readarr
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
