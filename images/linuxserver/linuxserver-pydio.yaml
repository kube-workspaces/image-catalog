apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-pydio
spec:
  defaultPath: /
  defaultPort: 443
  description: 'Legacy or infrastructure image available on Docker Hub. pydio (formerly AjaXplorer)
    is a mature open source software solution for file sharing and synchronization. With intuitive
    user interfaces (web / mobile / desktop), Pydio provides enterprise-grade features to
    gain back control and privacy of your data: user directory connectors, legacy filesystems
    drivers, comprehensive admin interface, and much more.'
  category: Tool
  tags:
  - linuxserver
  - linux
  - hub-only
  displayName: Pydio (LinuxServer)
  homepageURL: https://pydio.com/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/pydio-banner.png
  image: linuxserver/pydio:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/pydio
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-pydio
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
