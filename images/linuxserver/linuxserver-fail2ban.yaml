apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-fail2ban
spec:
  defaultPath: /
  defaultPort: 80
  description: fail2ban is a daemon to ban hosts that cause multiple authentication errors.
    No browser endpoint; use the terminal or native client.
  category: Tool
  tags:
  - linuxserver
  - linux
  - network
  - security
  - cli
  displayName: Fail2Ban (LinuxServer)
  homepageURL: http://www.fail2ban.org/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/fail2ban-logo.png
  image: linuxserver/fail2ban:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/fail2ban
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-fail2ban
