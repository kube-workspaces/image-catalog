apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-lsio-api
spec:
  defaultPath: /
  defaultPort: 8000
  description: Legacy or infrastructure image available on Docker Hub. LinuxServer API container
    from LinuxServer.io.
  category: Tool
  tags:
  - linuxserver
  - linux
  - internal
  - hub-only
  displayName: LinuxServer API (LinuxServer)
  homepageURL: https://hub.docker.com/r/linuxserver/lsio-api
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/linuxserver-ls-logo.png
  image: linuxserver/lsio-api:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/lsio-api
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-lsio-api
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
