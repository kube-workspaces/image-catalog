apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-pcsx2
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[PCSX2] is an open source PS2 Emulator.'
  category: Game
  tags:
  - linuxserver
  - linux
  - games
  displayName: PCSX2 (LinuxServer)
  homepageURL: https://pcsx2.net/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/pcsx2-logo.png
  image: linuxserver/pcsx2:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/pcsx2
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-pcsx2
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
