apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-unifi-controller
spec:
  defaultPath: /
  defaultPort: 8443
  description: Legacy or infrastructure image available on Docker Hub. The UniFi Controller
    software is a powerful, enterprise wireless software engine ideal for high-density client
    deployments requiring low latency and high uptime performance.
  category: Tool
  tags:
  - linuxserver
  - linux
  - hub-only
  displayName: UniFi Controller (LinuxServer)
  homepageURL: https://www.ubnt.com/enterprise/#unifi
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/unifi-banner.png
  image: linuxserver/unifi-controller:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/unifi-controller
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-unifi-controller
  additionalPorts:
  - name: udp-3478
    port: 3478
    protocol: UDP
  - name: udp-10001
    port: 10001
    protocol: UDP
  - name: tcp-8080
    port: 8080
    protocol: TCP
  - name: udp-1900
    port: 1900
    protocol: UDP
  - name: tcp-8843
    port: 8843
    protocol: TCP
  - name: tcp-8880
    port: 8880
    protocol: TCP
  - name: tcp-6789
    port: 6789
    protocol: TCP
  - name: udp-5514
    port: 5514
    protocol: UDP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
