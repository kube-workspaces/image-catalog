apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-gzdoom
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[GZDoom] is a feature centric port for all Doom engine games, based on ZDoom,
    adding an OpenGL renderer and powerful scripting capabilities.'
  category: Game
  tags:
  - linuxserver
  - linux
  - games
  displayName: GZDoom (LinuxServer)
  homepageURL: https://gzdoom.app/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/gzdoom-logo.png
  image: linuxserver/gzdoom:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/gzdoom
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-gzdoom
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
