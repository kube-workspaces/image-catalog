apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-citron
spec:
  defaultPath: /
  defaultPort: 3000
  description: Deprecated by LinuxServer.io. [Citron] is a feature rich Switch 1 emulator
    for homebrew.
  category: Game
  tags:
  - linuxserver
  - linux
  - games
  - deprecated
  displayName: Citron (LinuxServer)
  homepageURL: https://citron-emu.org/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/citron-logo.png
  image: linuxserver/citron:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/citron
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-citron
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
