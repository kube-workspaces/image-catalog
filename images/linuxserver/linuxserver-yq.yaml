apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-yq
spec:
  defaultPath: /
  defaultPort: 80
  description: Legacy or infrastructure image available on Docker Hub. yq container from LinuxServer.io.
    No browser endpoint; use the terminal or native client.
  category: Tool
  tags:
  - linuxserver
  - linux
  - internal
  - hub-only
  - cli
  displayName: yq (LinuxServer)
  homepageURL: https://hub.docker.com/r/linuxserver/yq
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/linuxserver-ls-logo.png
  image: linuxserver/yq:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/yq
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-yq
