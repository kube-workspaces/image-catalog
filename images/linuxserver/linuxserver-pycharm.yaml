apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-pycharm
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[PyCharm] offers out-of-the-box support for Python, databases, Jupyter, Git,
    Conda, PyTorch, TensorFlow, Hugging Face, Django, Flask, FastAPI, and more.'
  category: IDE
  tags:
  - linuxserver
  - linux
  - programming
  displayName: PyCharm (LinuxServer)
  homepageURL: https://www.jetbrains.com/pycharm/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/pycharm-logo.png
  image: linuxserver/pycharm:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/pycharm
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-pycharm
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
