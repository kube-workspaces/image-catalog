apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-sickbeard
spec:
  defaultPath: /
  defaultPort: 8081
  description: Legacy or infrastructure image available on Docker Hub. Sick Beard television
    library and download manager.
  category: Tool
  tags:
  - linuxserver
  - linux
  - hub-only
  displayName: Sickbeard (LinuxServer)
  homepageURL: https://hub.docker.com/r/linuxserver/sickbeard
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/linuxserver-ls-logo.png
  image: linuxserver/sickbeard:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/sickbeard
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-sickbeard
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
