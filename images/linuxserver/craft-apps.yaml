apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: craft-apps
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[ArtCraft] is a suite of open source creative applications written in Rust.
    This image bundles PhotoCraft (image editor), VectorCraft (vector illustration), FilmCraft
    (video editor), LightCraft (photo library and raw developer), PdfCraft (PDF workbench),
    EffectCraft (motion graphics and VFX compositor), DesignCraft (page layout and publishing)
    and FigCraft (interface design and prototyping) in...'
  category: Tool
  tags:
  - linuxserver
  - linux
  - image-editor
  - video-editor
  - media-tools
  displayName: Craft Apps (ArtCraft) (LinuxServer)
  homepageURL: https://getartcraft.com/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/artcraft-logo.png
  image: linuxserver/craft-apps:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/craft-apps
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-craft-apps
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
