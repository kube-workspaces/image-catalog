apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-shadps4
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[shadPS4] is an early PlayStation 4 emulator for Windows, Linux and macOS
    written in C++.'
  category: Game
  tags:
  - linuxserver
  - linux
  - games
  displayName: shadPS4 (LinuxServer)
  homepageURL: https://shadps4.net/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/shadps4-logo.png
  image: linuxserver/shadps4:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/shadps4
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-shadps4
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
