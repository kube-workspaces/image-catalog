apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-dogwalk
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[DOGWALK] is Blender Studio''s long awaited second game project, focused on
    creating a bite-sized interactive storytelling playground. Play as a big adorable dog
    and explore the winter woods with a little kid.'
  category: Game
  tags:
  - linuxserver
  - linux
  - games
  displayName: Dogwalk (LinuxServer)
  homepageURL: https://studio.blender.org/projects/dogwalk/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/dogwalk-logo.png
  image: linuxserver/dogwalk:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/dogwalk
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-dogwalk
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
