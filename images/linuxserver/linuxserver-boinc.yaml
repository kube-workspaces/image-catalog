apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-boinc
spec:
  defaultPath: /
  defaultPort: 8080
  description: '[BOINC] is a platform for high-throughput computing on a large scale (thousands
    or millions of computers). It can be used for volunteer computing (using consumer devices)
    or grid computing (using organizational resources). It supports virtualized, parallel,
    and GPU-based applications.'
  category: Tool
  tags:
  - linuxserver
  - linux
  - science
  displayName: BOINC (LinuxServer)
  homepageURL: https://boinc.berkeley.edu/
  icon: https://raw.githubusercontent.com/BOINC/boinc/master/doc/logo/boinc_logo_black.jpg
  image: linuxserver/boinc:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/boinc
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-boinc
  additionalPorts:
  - name: tcp-8181
    port: 8181
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
