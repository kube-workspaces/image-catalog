apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-signal
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[Signal] is a messaging app with privacy at its core. It is free and easy
    to use, with strong end-to-end encryption that keeps your communication completely private.'
  category: Tool
  tags:
  - linuxserver
  - linux
  - chat
  displayName: Signal (LinuxServer)
  homepageURL: https://signal.org/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/signal-logo.png
  image: linuxserver/signal:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/signal
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-signal
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
