apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-paperless-ngx
spec:
  defaultPath: /
  defaultPort: 8000
  description: Legacy or infrastructure image available on Docker Hub. paperless-ngx is an
    application by Daniel Quinn and contributors that indexes your scanned documents and allows
    you to easily search for documents and store metadata alongside your documents."
  category: Tool
  tags:
  - linuxserver
  - linux
  - hub-only
  displayName: Paperless Ngx (LinuxServer)
  homepageURL: https://github.com/paperless-ngx/paperless-ngx
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/paperless-ngx-banner.png
  image: linuxserver/paperless-ngx:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/paperless-ngx
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-paperless-ngx
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
  defaultCredentials:
    username: admin
    password: admin
