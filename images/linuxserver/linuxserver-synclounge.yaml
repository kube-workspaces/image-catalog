apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-synclounge
spec:
  defaultPath: /
  defaultPort: 8088
  description: synclounge is a third party tool that allows you to watch Plex in sync with
    your friends/family, wherever you are.
  category: Tool
  tags:
  - linuxserver
  - linux
  - media-tools
  displayName: SyncLounge (LinuxServer)
  homepageURL: https://github.com/samcm/synclounge
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/synclounge-banner.png
  image: linuxserver/synclounge:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/synclounge
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-synclounge
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
