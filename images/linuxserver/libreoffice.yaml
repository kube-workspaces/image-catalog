apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: libreoffice
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[LibreOffice] is a free and powerful office suite, and a successor to OpenOffice.org
    (commonly known as OpenOffice). Its clean interface and feature-rich tools help you unleash
    your creativity and enhance your productivity.'
  category: Tool
  tags:
  - linuxserver
  - linux
  - documents
  displayName: LibreOffice (LinuxServer)
  homepageURL: https://www.libreoffice.org/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/libreoffice-logo.png
  image: linuxserver/libreoffice:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/libreoffice
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-libreoffice
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
