apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-cardigann
spec:
  defaultPath: /
  defaultPort: 5060
  description: Legacy or infrastructure image available on Docker Hub. THIS IMAGE IS DEPRECATED.
    We will no longer be making updates or rebuilding this image. The Dockerhub endpoint will
    stay online with the current tags for this software. We recommend current users switch
    to linuxserver/jackett. cardigann a server for adding extra indexers to Sonarr, SickRage
    and CouchPotato via Torznab and TorrentPotato proxies. Behind the scenes Cardigann logs
    in and runs...
  category: Tool
  tags:
  - linuxserver
  - linux
  - hub-only
  displayName: Cardigann (LinuxServer)
  homepageURL: https://github.com/cardigann/cardigann
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/linuxserver-ls-logo.png
  image: linuxserver/cardigann:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/cardigann
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-cardigann
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
