apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-readme-sync
spec:
  defaultPath: /
  defaultPort: 80
  description: Legacy or infrastructure image available on Docker Hub. Readme Sync container
    from LinuxServer.io. No browser endpoint; use the terminal or native client.
  category: Tool
  tags:
  - linuxserver
  - linux
  - hub-only
  - cli
  displayName: Readme Sync (LinuxServer)
  homepageURL: https://hub.docker.com/r/linuxserver/readme-sync
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/linuxserver-ls-logo.png
  image: linuxserver/readme-sync:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/readme-sync
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-readme-sync
