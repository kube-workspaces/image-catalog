apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-python
spec:
  defaultPath: /
  defaultPort: 80
  description: Legacy or infrastructure image available on Docker Hub. Python container from
    LinuxServer.io. No browser endpoint; use the terminal or native client.
  category: Tool
  tags:
  - linuxserver
  - linux
  - internal
  - hub-only
  - cli
  displayName: Python (LinuxServer)
  homepageURL: https://hub.docker.com/r/linuxserver/python
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/linuxserver-ls-logo.png
  image: linuxserver/python:alpine324
  imageHomepageURL: https://hub.docker.com/r/linuxserver/python
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-python
