apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-znc
spec:
  defaultPath: /
  defaultPort: 6501
  description: znc is an IRC network bouncer or BNC. It can detach the client from the actual
    IRC server, and also from selected channels. Multiple clients from different locations
    can connect to a single ZNC account simultaneously and therefore appear under the same
    nickname on IRC.
  category: Tool
  tags:
  - linuxserver
  - linux
  - irc
  displayName: ZNC (LinuxServer)
  homepageURL: http://wiki.znc.in/ZNC
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/znc-logo.png
  image: linuxserver/znc:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/znc
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-znc
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
  defaultCredentials:
    username: admin
    password: admin
