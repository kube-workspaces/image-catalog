apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-apache
spec:
  defaultPath: /
  defaultPort: 80
  description: Legacy or infrastructure image available on Docker Hub. Apache HTTP Server
    with PHP support.
  category: Tool
  tags:
  - linuxserver
  - linux
  - hub-only
  displayName: Apache (LinuxServer)
  homepageURL: https://hub.docker.com/r/linuxserver/apache
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/linuxserver-ls-logo.png
  image: linuxserver/apache:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/apache
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-apache
  additionalPorts:
  - name: tcp-443
    port: 443
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
