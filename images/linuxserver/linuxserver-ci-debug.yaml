apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-ci-debug
spec:
  defaultPath: /
  defaultPort: 80
  description: Legacy or infrastructure image available on Docker Hub. LinuxServer continuous-integration
    debugging utility. No browser endpoint; use the terminal or native client.
  category: Tool
  tags:
  - linuxserver
  - linux
  - hub-only
  - cli
  displayName: LinuxServer CI Debug (LinuxServer)
  homepageURL: https://hub.docker.com/r/linuxserver/ci-debug
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/linuxserver-ls-logo.png
  image: linuxserver/ci-debug:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/ci-debug
  workspaceTypes:
  - container
  - scratch
