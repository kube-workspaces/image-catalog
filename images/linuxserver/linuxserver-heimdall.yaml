apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-heimdall
spec:
  defaultPath: /
  defaultPort: 80
  description: heimdall is a way to organise all those links to your most used web sites and
    web applications in a simple way. Simplicity is the key to Heimdall. Why not use it as
    your browser start page? It even has the ability to include a search bar using either
    Google, Bing or DuckDuckGo.
  category: Tool
  tags:
  - linuxserver
  - linux
  - dashboard
  displayName: Heimdall (LinuxServer)
  homepageURL: https://heimdall.site
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/heimdall-banner.png
  image: linuxserver/heimdall:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/heimdall
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-heimdall
  additionalPorts:
  - name: tcp-443
    port: 443
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
