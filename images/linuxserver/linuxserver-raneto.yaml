apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-raneto
spec:
  defaultPath: /
  defaultPort: 3000
  description: raneto - is an open source Knowledgebase platform that uses static Markdown
    files to power your Knowledgebase.
  category: Tool
  tags:
  - linuxserver
  - linux
  - content-management
  displayName: Raneto (LinuxServer)
  homepageURL: http://raneto.com/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/raneto-logo.png
  image: linuxserver/raneto:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/raneto
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-raneto
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
  defaultCredentials:
    username: admin
    password: password
