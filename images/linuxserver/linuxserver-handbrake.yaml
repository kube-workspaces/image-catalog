apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-handbrake
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[HandBrake] is an open-source tool, built by volunteers, for converting video
    from nearly any format to a selection of modern, widely supported codecs.'
  category: Tool
  tags:
  - linuxserver
  - linux
  - media-management
  displayName: HandBrake (LinuxServer)
  homepageURL: https://handbrake.fr/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/handbrake-logo.png
  image: linuxserver/handbrake:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/handbrake
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-handbrake
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
