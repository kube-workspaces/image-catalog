apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-habridge
spec:
  defaultPath: /
  defaultPort: 8080
  description: habridge emulates Philips Hue API to other home automation gateways such as
    an Amazon Echo/Dot Gen 1 (gen 2 has issues discovering ha-bridge) or other systems that
    support Philips Hue. The Bridge handles basic commands such as On, Off and brightness
    commands of the hue protocol. This bridge can control most devices that have a distinct
    API.
  category: Tool
  tags:
  - linuxserver
  - linux
  - home-automation
  displayName: HA Bridge (LinuxServer)
  homepageURL: https://github.com/bwssytems/ha-bridge/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/habridge-logo.png
  image: linuxserver/habridge:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/habridge
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-habridge
  additionalPorts:
  - name: tcp-50000
    port: 50000
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
