apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-darktable
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[darktable] is an open source photography workflow application and raw developer.
    A virtual lighttable and darkroom for photographers. It manages your digital negatives
    in a database, lets you view them through a zoomable lighttable and enables you to develop
    raw images and enhance them.'
  category: Tool
  tags:
  - linuxserver
  - linux
  - photos
  displayName: darktable (LinuxServer)
  homepageURL: https://www.darktable.org/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/darktable-logo.png
  image: linuxserver/darktable:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/darktable
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-darktable
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
