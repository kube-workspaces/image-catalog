apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-doplarr-rs
spec:
  defaultPath: /
  defaultPort: 80
  description: doplarr_rs is a Discord bot for requesting media through *arr backends, written
    in Rust. No browser endpoint; use the terminal or native client.
  category: Tool
  tags:
  - linuxserver
  - linux
  - media-requesters
  - cli
  displayName: Doplarr RS (LinuxServer)
  homepageURL: https://github.com/activexray/doplarr_rs
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/doplarr_rs-logo.png
  image: linuxserver/doplarr_rs:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/doplarr_rs
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-doplarr_rs
