apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-faster-whisper
spec:
  defaultPath: /
  defaultPort: 10300
  description: faster-whisper is a reimplementation of OpenAI's Whisper model using CTranslate2,
    which is a fast inference engine for Transformer models. This container provides a Wyoming
    protocol server for faster-whisper. No browser endpoint; use the terminal or native client.
  category: Tool
  tags:
  - linuxserver
  - linux
  - machine-learning
  - non-http
  displayName: Faster Whisper (LinuxServer)
  homepageURL: https://github.com/SYSTRAN/faster-whisper
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/linuxserver-ls-logo.png
  image: linuxserver/faster-whisper:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/faster-whisper
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-faster-whisper
