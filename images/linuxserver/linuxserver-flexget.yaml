apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-flexget
spec:
  defaultPath: /
  defaultPort: 5050
  description: flexget is a multipurpose automation tool for all of your media.
  category: Tool
  tags:
  - linuxserver
  - linux
  - downloaders
  displayName: FlexGet (LinuxServer)
  homepageURL: http://flexget.com/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/flexget-banner.png
  image: linuxserver/flexget:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/flexget
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-flexget
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
