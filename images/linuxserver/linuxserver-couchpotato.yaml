apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-couchpotato
spec:
  defaultPath: /
  defaultPort: 5050
  description: Legacy or infrastructure image available on Docker Hub. CouchPotato is an automatic
    NZB and torrent downloader. You can keep a movies I want list and it will search for NZBs/torrents
    of these movies every X hours. Once a movie is found, it will send it to SABnzbd or download
    the torrent to a specified directory.
  category: Tool
  tags:
  - linuxserver
  - linux
  - hub-only
  displayName: CouchPotato (LinuxServer)
  homepageURL: https://couchpota.to/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/linuxserver-ls-logo.png
  image: linuxserver/couchpotato:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/couchpotato
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-couchpotato
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
