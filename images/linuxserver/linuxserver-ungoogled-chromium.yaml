apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-ungoogled-chromium
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[Ungoogled Chromium] is Google Chromium, sans dependency on Google web services.'
  category: Browser
  tags:
  - linuxserver
  - linux
  - web-browser
  displayName: Ungoogled Chromium (LinuxServer)
  homepageURL: https://github.com/ungoogled-software/ungoogled-chromium
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/ungoogled-chromium-logo.png
  image: linuxserver/ungoogled-chromium:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/ungoogled-chromium
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-ungoogled-chromium
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
