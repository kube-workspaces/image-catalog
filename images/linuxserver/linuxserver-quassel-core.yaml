apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-quassel-core
spec:
  defaultPath: /
  defaultPort: 4242
  description: Legacy or infrastructure image available on Docker Hub. quassel-core is a modern,
    cross-platform, distributed IRC client, meaning that one (or multiple) client(s) can attach
    to and detach from a central core. This container handles the IRC connection (quasselcore)
    and requires a desktop client (quasselclient) to be used and configured. It is designed
    to be always on and will keep your identity present in IRC even when your clients cannot
    be online.... No browser endpoint; use the terminal or native client.
  category: Tool
  tags:
  - linuxserver
  - linux
  - hub-only
  - non-http
  displayName: Quassel Core (LinuxServer)
  homepageURL: http://quassel-irc.org/
  icon: http://icons.iconarchive.com/icons/oxygen-icons.org/oxygen/256/Apps-quassel-icon.png
  image: linuxserver/quassel-core:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/quassel-core
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-quassel-core
  additionalPorts:
  - name: tcp-10113
    port: 10113
    protocol: TCP
