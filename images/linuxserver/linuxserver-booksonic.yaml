apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-booksonic
spec:
  defaultPath: /
  defaultPort: 4040
  description: Legacy or infrastructure image available on Docker Hub. booksonic is a server
    and an app for streaming your audiobooks to any pc or android phone. Most of the functionality
    is also availiable on other platforms that have apps for subsonic.
  category: Tool
  tags:
  - linuxserver
  - linux
  - hub-only
  displayName: Booksonic (LinuxServer)
  homepageURL: http://booksonic.org
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/booksonic.png
  image: linuxserver/booksonic:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/booksonic
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-booksonic
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
  defaultCredentials:
    username: admin
    password: admin
