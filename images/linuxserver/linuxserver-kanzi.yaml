apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-kanzi
spec:
  defaultPath: /
  defaultPort: 8000
  description: Legacy or infrastructure image available on Docker Hub. kanzi, formerly titled
    Kodi-Alexa, this custom skill is the ultimate voice remote control for navigating Kodi.
    It can do anything you can think of (100+ intents). This container also contains lexigram-cli
    to setup Kanzi with an Amazon Developer Account and automatically deploy it to Amazon.
  category: Tool
  tags:
  - linuxserver
  - linux
  - hub-only
  displayName: Kanzi (LinuxServer)
  homepageURL: https://lexigr.am/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/kanzi.png
  image: linuxserver/kanzi:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/kanzi
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-kanzi
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
