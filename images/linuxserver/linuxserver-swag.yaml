apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-swag
spec:
  defaultPath: /
  defaultPort: 443
  description: SWAG - Secure Web Application Gateway (formerly known as letsencrypt, no relation
    to Let's Encrypt™) sets up an Nginx webserver and reverse proxy with php support and a
    built-in certbot client that automates free SSL server certificate generation and renewal
    processes (Let's Encrypt and ZeroSSL). It also contains fail2ban for intrusion prevention.
  category: Tool
  tags:
  - linuxserver
  - linux
  - reverse-proxy
  displayName: SWAG (LinuxServer)
  homepageURL: https://linuxserver.io
  icon: https://github.com/linuxserver/docker-templates/raw/master/linuxserver.io/img/swag.gif
  image: linuxserver/swag:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/swag
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-swag
  additionalPorts:
  - name: tcp-80
    port: 80
    protocol: TCP
  - name: udp-443
    port: 443
    protocol: UDP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
