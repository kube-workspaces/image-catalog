apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-limnoria
spec:
  defaultPath: /
  defaultPort: 8080
  description: limnoria A robust, full-featured, and user/programmer-friendly Python IRC bot,
    with many existing plugins. Successor of the well-known Supybot.
  category: Tool
  tags:
  - linuxserver
  - linux
  - irc
  displayName: Limnoria (LinuxServer)
  homepageURL: https://github.com/ProgVal/limnoria
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/limnoria-icon.png
  image: linuxserver/limnoria:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/limnoria
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-limnoria
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
