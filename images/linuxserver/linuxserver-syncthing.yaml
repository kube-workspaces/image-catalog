apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-syncthing
spec:
  defaultPath: /
  defaultPort: 8384
  description: syncthing replaces proprietary sync and cloud services with something open,
    trustworthy and decentralized. Your data is your data alone and you deserve to choose
    where it is stored, if it is shared with some third party and how it's transmitted over
    the Internet.
  category: Tool
  tags:
  - linuxserver
  - linux
  - backup
  displayName: Syncthing (LinuxServer)
  homepageURL: https://syncthing.net
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/syncthing-banner.png
  image: linuxserver/syncthing:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/syncthing
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-syncthing
  additionalPorts:
  - name: tcp-22000
    port: 22000
    protocol: TCP
  - name: udp-22000
    port: 22000
    protocol: UDP
  - name: udp-21027
    port: 21027
    protocol: UDP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
