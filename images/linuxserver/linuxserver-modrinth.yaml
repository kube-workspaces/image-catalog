apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-modrinth
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[Modrinth App] is a unique, open source launcher that allows you to play your
    favorite mods, and keep them up to date, all in one neat little package.'
  category: Game
  tags:
  - linuxserver
  - linux
  - games
  displayName: Modrinth (LinuxServer)
  homepageURL: https://modrinth.com/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/modrinth-logo.png
  image: linuxserver/modrinth:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/modrinth
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-modrinth
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
