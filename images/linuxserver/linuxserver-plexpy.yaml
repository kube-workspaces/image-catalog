apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-plexpy
spec:
  defaultPath: /
  defaultPort: 8181
  description: Legacy or infrastructure image available on Docker Hub. plexpy is a python
    based web application for monitoring, analytics and notifications for Plex Media Server.
  category: Tool
  tags:
  - linuxserver
  - linux
  - media-tools
  - hub-only
  displayName: Plexpy (LinuxServer)
  homepageURL: http://tautulli.com
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/tautulli-icon.png
  image: linuxserver/plexpy:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/plexpy
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-plexpy
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
