apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-apprise-api
spec:
  defaultPath: /
  defaultPort: 8000
  description: apprise-api Takes advantage of Apprise through your network with a user-friendly
    API. * Send notifications to more than 100 services. * An incredibly lightweight gateway
    to Apprise. * A production ready micro-service at your disposal. * A Simple Website to
    verify and test your configuration with. Apprise API was designed to easily fit into existing
    (and new) eco-systems that are looking for a...
  category: Tool
  tags:
  - linuxserver
  - linux
  - monitoring
  displayName: Apprise API (LinuxServer)
  homepageURL: https://github.com/caronc/apprise-api
  icon: https://raw.githubusercontent.com/caronc/apprise-api/master/apprise_api/static/logo.png
  image: linuxserver/apprise-api:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/apprise-api
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-apprise-api
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
