apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-davos
spec:
  defaultPath: /
  defaultPort: 8080
  description: davos is an FTP automation tool that periodically scans given host locations
    for new files. It can be configured for various purposes, including listening for specific
    files to appear in the host location, ready for it to download and then move, if required.
    It also supports completion notifications as well as downstream API calls, to further
    the workflow.
  category: Tool
  tags:
  - linuxserver
  - linux
  - ftp
  displayName: Davos (LinuxServer)
  homepageURL: https://github.com/linuxserver/davos
  icon: https://raw.githubusercontent.com/linuxserver/davos/master/docs/list.PNG
  image: linuxserver/davos:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/davos
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-davos
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
