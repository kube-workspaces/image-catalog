apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-jellyfin
spec:
  defaultPath: /
  defaultPort: 8096
  description: jellyfin is a Free Software Media System that puts you in control of managing
    and streaming your media. It is an alternative to the proprietary Emby and Plex, to provide
    media from a dedicated server to end-user devices via multiple apps. Jellyfin is descended
    from Emby's 3.5.2 release and ported to the .NET Core framework to enable full cross-platform
    support. There are no strings attached,...
  category: Tool
  tags:
  - linuxserver
  - linux
  - media-servers
  - music
  - audiobooks
  displayName: Jellyfin (LinuxServer)
  homepageURL: https://github.com/jellyfin/jellyfin
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/jellyfin-logo.png
  image: linuxserver/jellyfin:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/jellyfin
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-jellyfin
  additionalPorts:
  - name: tcp-8920
    port: 8920
    protocol: TCP
  - name: udp-7359
    port: 7359
    protocol: UDP
  - name: udp-1900
    port: 1900
    protocol: UDP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
