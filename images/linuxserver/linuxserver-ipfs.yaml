apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-ipfs
spec:
  defaultPath: /
  defaultPort: 80
  description: Legacy or infrastructure image available on Docker Hub. IPFS - A peer-to-peer
    hypermedia protocol designed to make the web faster, safer, and more open.
  category: Tool
  tags:
  - linuxserver
  - linux
  - hub-only
  displayName: IPFS (LinuxServer)
  homepageURL: https://ipfs.io/
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/ipfs.svg
  image: linuxserver/ipfs:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/ipfs
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-ipfs
  additionalPorts:
  - name: tcp-4001
    port: 4001
    protocol: TCP
  - name: tcp-5001
    port: 5001
    protocol: TCP
  - name: tcp-8080
    port: 8080
    protocol: TCP
  - name: tcp-443
    port: 443
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
