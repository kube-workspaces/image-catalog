apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-oscam
spec:
  defaultPath: /
  defaultPort: 8888
  description: oscam is an Open Source Conditional Access Module software used for descrambling
    DVB transmissions using smart cards. It's both a server and a client.
  category: Tool
  tags:
  - linuxserver
  - linux
  - media-tools
  displayName: OSCam (LinuxServer)
  homepageURL: https://git.streamboard.tv/common/oscam
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/oscam-logo.png
  image: linuxserver/oscam:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/oscam
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-oscam
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
