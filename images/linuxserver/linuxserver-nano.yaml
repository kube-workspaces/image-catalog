apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-nano
spec:
  defaultPath: /
  defaultPort: 8075
  description: Legacy or infrastructure image available on Docker Hub. nano is a digital payment
    protocol designed to be accessible and lightweight, with a focus on removing inefficiencies
    present in other cryptocurrencies. With ultrafast transactions and zero fees on a secure,
    green and decentralized network, this makes Nano ideal for everyday transactions.
  category: Tool
  tags:
  - linuxserver
  - linux
  - hub-only
  displayName: Nano (LinuxServer)
  homepageURL: https://nano.org/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/linuxserver-ls-logo.png
  image: linuxserver/nano:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/nano
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-nano
  additionalPorts:
  - name: tcp-3000
    port: 3000
    protocol: TCP
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
