apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-freetube
spec:
  defaultPath: /
  defaultPort: 3000
  description: Deprecated by LinuxServer.io. [FreeTube] is a feature-rich and user-friendly
    YouTube client with a focus on privacy.
  category: Tool
  tags:
  - linuxserver
  - linux
  - video-streaming
  - deprecated
  displayName: FreeTube (LinuxServer)
  homepageURL: https://freetubeapp.io/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/freetube-logo.png
  image: linuxserver/freetube:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/freetube
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-freetube
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
