apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-brave
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[The Brave browser] is a fast, private and secure web browser for PC, Mac
    and mobile.'
  category: Browser
  tags:
  - linuxserver
  - linux
  - web-browser
  displayName: Brave (LinuxServer)
  homepageURL: https://brave.com/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/brave-logo.png
  image: linuxserver/brave:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/brave
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-brave
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
