apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-melonds
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[melonDS] aims at providing fast and accurate Nintendo DS emulation.'
  category: Game
  tags:
  - linuxserver
  - linux
  - games
  displayName: melonDS (LinuxServer)
  homepageURL: https://melonds.kuribo64.net/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/melonds-logo.png
  image: linuxserver/melonds:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/melonds
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-melonds
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
