apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-netbox
spec:
  defaultPath: /
  defaultPort: 8000
  description: netbox is an IP address management (IPAM) and data center infrastructure management
    (DCIM) tool. Initially conceived by the network engineering team at DigitalOcean, NetBox
    was developed specifically to address the needs of network and infrastructure engineers.
    It is intended to function as a domain-specific source of truth for network operations.
  category: Tool
  tags:
  - linuxserver
  - linux
  - administration
  - business
  displayName: NetBox (LinuxServer)
  homepageURL: https://github.com/netbox-community/netbox
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/netbox-logo.png
  image: linuxserver/netbox:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/netbox
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-netbox
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
