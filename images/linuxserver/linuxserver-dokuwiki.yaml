apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-dokuwiki
spec:
  defaultPath: /
  defaultPort: 80
  description: dokuwiki is a simple to use and highly versatile Open Source wiki software
    that doesn't require a database. It is loved by users for its clean and readable syntax.
    The ease of maintenance, backup and integration makes it an administrator's favorite.
    Built in access controls and authentication connectors make DokuWiki especially useful
    in the enterprise context and the large number of plugins...
  category: Tool
  tags:
  - linuxserver
  - linux
  - content-management
  displayName: DokuWiki (LinuxServer)
  homepageURL: https://www.dokuwiki.org/dokuwiki/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/dokuwiki-icon.png
  image: linuxserver/dokuwiki:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/dokuwiki
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-dokuwiki
  additionalPorts:
  - name: tcp-443
    port: 443
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
