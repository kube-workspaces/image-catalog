apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-inkscape
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[Inkscape] is professional quality vector graphics software which runs on
    Linux, Mac OS X and Windows desktop computers.'
  category: Tool
  tags:
  - linuxserver
  - linux
  - 3d-modeling
  displayName: Inkscape (LinuxServer)
  homepageURL: https://inkscape.org/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/inkscape-logo.png
  image: linuxserver/inkscape:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/inkscape
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-inkscape
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
