apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-opera
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[Opera] is a multi-platform web browser developed by its namesake company
    Opera. The browser is based on Chromium, but distinguishes itself from other Chromium-based
    browsers (Chrome, Edge, etc.) through its user interface and other features.'
  category: Browser
  tags:
  - linuxserver
  - linux
  - web-browser
  displayName: Opera (LinuxServer)
  homepageURL: https://www.opera.com/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/opera-icon.png
  image: linuxserver/opera:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/opera
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-opera
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
