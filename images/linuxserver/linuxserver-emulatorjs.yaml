apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-emulatorjs
spec:
  defaultPath: /
  defaultPort: 3000
  description: Deprecated by LinuxServer.io. emulatorjs - In browser web based emulation portable
    to nearly any device for many retro consoles. A mix of emulators is used between Libretro
    and EmulatorJS.
  category: Game
  tags:
  - linuxserver
  - linux
  - games
  - deprecated
  displayName: EmulatorJS (LinuxServer)
  homepageURL: https://github.com/linuxserver/emulatorjs
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/emulatorjs-logo.png
  image: linuxserver/emulatorjs:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/emulatorjs
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-emulatorjs
  additionalPorts:
  - name: tcp-80
    port: 80
    protocol: TCP
  - name: tcp-4001
    port: 4001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
