apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-tvheadend
spec:
  defaultPath: /
  defaultPort: 9981
  description: 'tvheadend works as a proxy server: is a TV streaming server and recorder for
    Linux, FreeBSD and Android supporting DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV,
    SAT>IP and HDHomeRun as input sources. Tvheadend offers the HTTP (VLC, MPlayer), HTSP
    (Kodi, Movian) and SAT>IP streaming. Multiple EPG sources are supported (over-the-air
    DVB and ATSC including OpenTV DVB extensions, XMLTV, PyXML).'
  category: Tool
  tags:
  - linuxserver
  - linux
  - media-tools
  displayName: Tvheadend (LinuxServer)
  homepageURL: https://www.tvheadend.org/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/tvheadend-big.png
  image: linuxserver/tvheadend:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/tvheadend
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-tvheadend
  additionalPorts:
  - name: tcp-9982
    port: 9982
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
