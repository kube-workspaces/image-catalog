apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-pyload
spec:
  defaultPath: /
  defaultPort: 8000
  description: Legacy or infrastructure image available on Docker Hub. pyLoad is a Free and
    Open Source download manager written in Python and designed to be extremely lightweight,
    easily extensible and fully manageable via web.
  category: Tool
  tags:
  - linuxserver
  - linux
  - hub-only
  displayName: pyLoad (LinuxServer)
  homepageURL: https://pyload.net/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/pyload-icon.png
  image: linuxserver/pyload:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/pyload
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-pyload
  additionalPorts:
  - name: tcp-7227
    port: 7227
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
  defaultCredentials:
    username: admin
    password: password
