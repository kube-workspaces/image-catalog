apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-krita
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[Krita] is a professional FREE and open source painting program. It is made
    by artists that want to see affordable art tools for everyone.'
  category: Tool
  tags:
  - linuxserver
  - linux
  - image-editor
  displayName: Krita (LinuxServer)
  homepageURL: https://krita.org/en/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/krita-logo.png
  image: linuxserver/krita:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/krita
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-krita
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
