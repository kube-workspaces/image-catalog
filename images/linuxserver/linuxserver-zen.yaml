apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-zen
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[Zen Browser] is a free and open-source fork of Mozilla Firefox with a focus
    on privacy, customizability and design.'
  category: Browser
  tags:
  - linuxserver
  - linux
  - web-browser
  displayName: Zen (LinuxServer)
  homepageURL: https://zen-browser.app/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/zen-logo.png
  image: linuxserver/zen:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/zen
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-zen
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
