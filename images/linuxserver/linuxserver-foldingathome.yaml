apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-foldingathome
spec:
  defaultPath: /
  defaultPort: 7396
  description: '[Folding@home] is a distributed computing project for simulating protein dynamics,
    including the process of protein folding and the movements of proteins implicated in a
    variety of diseases. It brings together citizen scientists who volunteer to run simulations
    of protein dynamics on their personal computers. Insights from this data are helping scientists
    to better understand biology, and...'
  category: Tool
  tags:
  - linuxserver
  - linux
  - science
  displayName: Folding@home (LinuxServer)
  homepageURL: https://foldingathome.org/
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/foldingathome.svg
  image: linuxserver/foldingathome:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/foldingathome
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-foldingathome
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
