apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: obsidian
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[Obsidian] is a note-taking app that lets you create, link, and organize your
    notes on your device, with hundreds of plugins and themes to customize your workflow.
    You can also publish your notes online, access them offline, and sync them securely with
    end-to-end encryption.'
  category: Tool
  tags:
  - linuxserver
  - linux
  - content-management
  displayName: Obsidian (LinuxServer)
  homepageURL: https://obsidian.md
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/obsidian-logo.png
  image: linuxserver/obsidian:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/obsidian
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-obsidian
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
