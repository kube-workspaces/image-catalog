apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-kometa
spec:
  defaultPath: /
  defaultPort: 80
  description: kometa is a powerful tool designed to give you complete control over your media
    libraries. With kometa, you can take your customization to the next level, with granular
    control over metadata, collections, overlays, and much more. No browser endpoint; use
    the terminal or native client.
  category: Tool
  tags:
  - linuxserver
  - linux
  - media-management
  - cli
  displayName: Kometa (LinuxServer)
  homepageURL: https://github.com/Kometa-Team/Kometa
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/kometa-banner.png
  image: linuxserver/kometa:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/kometa
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-kometa
