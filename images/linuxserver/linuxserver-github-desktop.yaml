apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: linuxserver-github-desktop
spec:
  defaultPath: /
  defaultPort: 3000
  description: '[Github Desktop] is an open source Electron-based GitHub app. It is written
    in TypeScript and uses React.'
  category: Tool
  tags:
  - linuxserver
  - linux
  - programming
  displayName: GitHub Desktop (LinuxServer)
  homepageURL: https://desktop.github.com/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/github-desktop-icon.png
  image: linuxserver/github-desktop:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/github-desktop
  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-github-desktop
  additionalPorts:
  - name: tcp-3001
    port: 3001
    protocol: TCP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    preservePathPrefix: true
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  defaultUser: abc
  defaultHomedir: /config
