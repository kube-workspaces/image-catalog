apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: drawio
spec:
  defaultPath: /
  defaultPort: 8080
  description: Self-hosted draw.io (diagrams.net) for creating flowcharts, UML diagrams,
    network diagrams, org charts, and more. Full-featured diagramming tool.
  category: Productivity
  displayName: draw.io (Diagrams)
  homepageURL: https://www.drawio.com
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/diagrams-net.svg
  image: jgraph/drawio:latest
  imageHomepageURL: https://hub.docker.com/r/jgraph/drawio
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
  sourceURL: https://github.com/jgraph/drawio
