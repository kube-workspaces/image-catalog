apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-desktop
  annotations:
    catalog.kubeworkspaces.io/example: "true"
spec:
  defaultCredentials:
    password: password
    username: kasm_user
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  description: Ubuntu desktop streamed via KasmVNC
  category: Desktop
  displayName: Kasm Desktop
  homepageURL: https://kasmweb.com
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/kasm.svg
  image: kasmweb/desktop:1.19.0
  imageHomepageURL: https://hub.docker.com/r/kasmweb/desktop
  privileged: true
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  sourceURL: https://github.com/kasmtech
  defaultUser: kasm_user
  defaultHomedir: /home/kasm_user
