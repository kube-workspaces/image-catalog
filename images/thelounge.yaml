apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: thelounge
spec:
  defaultPath: /
  defaultPort: 9000
  description: Modern self-hosted web IRC client. Always connected, multi-user support,
    push notifications, file uploads, and link previews.
  category: Productivity
  displayName: The Lounge (IRC)
  homepageURL: https://thelounge.chat
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/thelounge.svg
  image: linuxserver/thelounge:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/thelounge
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
  sourceURL: https://github.com/thelounge/thelounge
  defaultUser: abc
  defaultHomedir: /config
