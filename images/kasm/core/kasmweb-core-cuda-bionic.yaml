apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-core-cuda-bionic
spec:
  image: kasmweb/core-cuda-bionic:1.10.0
  defaultCredentials:
    username: kasm_user
    password: password
  defaultEnv:
  - name: VNC_PW
    value: password
  - name: START_XFCE4
    value: '1'
  defaultPath: /
  defaultPort: 6901
  defaultSharedMemory: true
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultShell: /bin/bash
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  displayName: Core CUDA Development Toolkit Bionic
  description: CUDA toolkit base image for Kasm Workspaces
  category: Desktop
  tags:
  - core
  - kasm
  - kasmvnc
  - linux
  homepageURL: https://kasm.com/images
  imageHomepageURL: https://hub.docker.com/r/kasmweb/core-cuda-bionic
  icon: https://registry.kasmweb.com/1.1/icons/nvidia.png
  sourceURL: https://github.com/kasmtech/workspaces-core-images
