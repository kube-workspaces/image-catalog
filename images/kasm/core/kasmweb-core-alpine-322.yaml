apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-core-alpine-322
spec:
  image: kasmweb/core-alpine-322:1.19.0
  defaultCredentials:
    username: kasm_user
    password: password
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  defaultSharedMemory: true
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultShell: /bin/bash
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  displayName: Core Alpine 3.22
  description: Alpine 3.22 base image for Kasm Workspaces
  category: Desktop
  tags:
  - core
  - kasm
  - kasmvnc
  - linux
  homepageURL: https://kasm.com/images
  imageHomepageURL: https://hub.docker.com/r/kasmweb/core-alpine-322
  icon: https://registry.kasmweb.com/1.1/icons/alpine.svg
  sourceURL: https://github.com/kasmtech/workspaces-core-images/blob/develop/dockerfile-kasm-core-alpine
