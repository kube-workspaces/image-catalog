apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-filezilla
spec:
  image: kasmweb/filezilla:1.19.0
  defaultCredentials:
    username: kasm_user
    password: password
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  defaultSharedMemory: true
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultShell: /bin/bash
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  displayName: FileZilla
  description: A free and open-source, cross-platform FTP/FTPS application.
  category: Productivity
  tags:
  - desktop
  - kasm
  - kasmvnc
  - linux
  - productivity
  homepageURL: https://kasm.com/images
  imageHomepageURL: https://hub.docker.com/r/kasmweb/filezilla
  icon: https://registry.kasmweb.com/1.1/icons/filezilla.png
  sourceURL: https://github.com/kasmtech/workspaces-images/blob/develop/dockerfile-kasm-filezilla
