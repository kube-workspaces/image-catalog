apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-retroarch
spec:
  image: kasmweb/retroarch:1.19.0
  defaultCredentials:
    username: kasm_user
    password: password
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  defaultSharedMemory: true
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultShell: /bin/bash
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  displayName: RetroArch
  description: RetroArch is a frontend for emulators, game engines and media players.
  category: Game
  tags:
  - desktop
  - games
  - kasm
  - kasmvnc
  - linux
  homepageURL: https://kasm.com/images
  imageHomepageURL: https://hub.docker.com/r/kasmweb/retroarch
  icon: https://registry.kasmweb.com/1.1/icons/retroarch.svg
  sourceURL: https://github.com/kasmtech/workspaces-images/blob/develop/dockerfile-kasm-retroarch
