apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-remmina
spec:
  image: kasmweb/remmina:1.19.0
  defaultCredentials:
    username: kasm_user
    password: password
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  defaultSharedMemory: true
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultShell: /bin/bash
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  displayName: Remmina
  description: Remmina is a remote desktop client for POSIX-based computer operating systems.
    It supports the Remote Desktop Protocol, VNC, NX, XDMCP, SPICE and SSH.
  category: Productivity
  tags:
  - desktop
  - kasm
  - kasmvnc
  - linux
  - productivity
  - remote access
  homepageURL: https://kasm.com/images
  imageHomepageURL: https://hub.docker.com/r/kasmweb/remmina
  icon: https://registry.kasmweb.com/1.1/icons/remmina.png
  sourceURL: https://github.com/kasmtech/workspaces-images/blob/develop/dockerfile-kasm-remmina
