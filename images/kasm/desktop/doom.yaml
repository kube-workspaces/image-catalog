apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: doom
spec:
  defaultCredentials:
    password: password
    username: kasm_user
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  description: Doom is a 1993 first-person shooter developed by id Software.
  category: Game
  tags:
  - desktop
  - games
  - kasm
  - kasmvnc
  - linux
  - retro
  - vnc
  displayName: Doom
  homepageURL: https://kasm.com/images
  icon: https://registry.kasmweb.com/1.1/icons/doom.png
  image: kasmweb/doom:1.19.0-rolling-daily
  defaultImagePullPolicy: Always
  imageHomepageURL: https://hub.docker.com/r/kasmweb/doom
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  sourceURL: https://github.com/kasmtech/workspaces-images/blob/develop/dockerfile-kasm-doom
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultSharedMemory: true
  defaultShell: /bin/bash
