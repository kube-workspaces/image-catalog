apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-ubuntu-focal-desktop-vpn
spec:
  image: kasmweb/ubuntu-focal-desktop-vpn:1.16.1
  defaultCredentials:
    username: kasm_user
    password: password
  defaultEnv:
  - name: VNC_PW
    value: password
  - name: TAILSCALE_KEY
    value: ''
  - name: SHOW_VPN_STATUS
    value: '1'
  - name: SHOW_IP_STATUS
    value: '1'
  defaultPath: /
  defaultPort: 6901
  defaultSharedMemory: true
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultShell: /bin/bash
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  displayName: Ubuntu Focal VPN
  description: Ubuntu is a Linux distribution based on Debian. This container includes Ubuntu
    Focal with tools for using popular VPN services.
  category: Desktop
  tags:
  - desktop
  - development
  - kasm
  - kasmvnc
  - linux
  - productivity
  homepageURL: https://kasm.com/images
  imageHomepageURL: https://hub.docker.com/r/kasmweb/ubuntu-focal-desktop-vpn
  icon: https://registry.kasmweb.com/1.1/icons/ubuntu.png
  sourceURL: https://github.com/kasmtech/workspaces-images
