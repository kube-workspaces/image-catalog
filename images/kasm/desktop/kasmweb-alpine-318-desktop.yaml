apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-alpine-318-desktop
spec:
  image: kasmweb/alpine-318-desktop:1.16.1
  defaultCredentials:
    username: kasm_user
    password: password
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  defaultSharedMemory: true
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultShell: /bin/bash
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  displayName: Alpine 3.18
  description: Alpine 3.18 desktop for Kasm Workspaces
  category: Desktop
  tags:
  - desktop
  - kasm
  - kasmvnc
  - linux
  homepageURL: https://kasm.com/images
  imageHomepageURL: https://hub.docker.com/r/kasmweb/alpine-318-desktop
  icon: https://registry.kasmweb.com/1.1/icons/alpine.svg
  sourceURL: https://github.com/kasmtech/workspaces-images
