apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-centos-7-desktop
spec:
  image: kasmweb/centos-7-desktop:1.15.0
  defaultCredentials:
    username: kasm_user
    password: password
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  defaultSharedMemory: true
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultShell: /bin/bash
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  displayName: CentOS 7
  description: CentOS 7 desktop for Kasm Workspaces
  category: Desktop
  tags:
  - desktop
  - kasm
  - kasmvnc
  - linux
  homepageURL: https://kasm.com/images
  imageHomepageURL: https://hub.docker.com/r/kasmweb/centos-7-desktop
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/centos.svg
  sourceURL: https://github.com/kasmtech/workspaces-images
