apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-ubuntu-bionic-dind
spec:
  image: kasmweb/ubuntu-bionic-dind:develop
  defaultCredentials:
    username: kasm_user
    password: password
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  defaultSharedMemory: true
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultShell: /bin/bash
  privileged: true
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  defaultImagePullPolicy: Always
  displayName: Ubuntu Bionic Dind
  description: Docker for Kasm Workspaces
  category: Desktop
  tags:
  - desktop
  - kasm
  - kasmvnc
  - linux
  homepageURL: https://kasm.com/images
  imageHomepageURL: https://hub.docker.com/r/kasmweb/ubuntu-bionic-dind
  icon: https://registry.kasmweb.com/1.1/icons/ubuntu.png
  sourceURL: https://github.com/kasmtech/workspaces-images
