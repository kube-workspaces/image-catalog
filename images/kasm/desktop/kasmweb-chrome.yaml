apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-chrome
  annotations:
    catalog.kubeworkspaces.io/example: 'true'
spec:
  defaultCredentials:
    password: password
    username: kasm_user
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  description: Google Chrome is a cross-platform web browser developed by Google.
  category: Browser
  displayName: Chrome
  homepageURL: https://kasm.com/images
  icon: https://registry.kasmweb.com/1.1/icons/chrome.png
  image: kasmweb/chrome:1.19.0
  imageHomepageURL: https://hub.docker.com/r/kasmweb/chrome
  privileged: true
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  sourceURL: https://github.com/kasmtech/workspaces-images/blob/develop/dockerfile-kasm-chrome
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultSharedMemory: true
  defaultShell: /bin/bash
  tags:
  - browser
  - desktop
  - kasm
  - kasmvnc
  - linux
