apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-obsidian
spec:
  image: kasmweb/obsidian:1.19.0
  defaultCredentials:
    username: kasm_user
    password: password
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  defaultSharedMemory: true
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultShell: /bin/bash
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  displayName: Obsidian
  description: Obsidian is a note-taking app that lets you organize and connect your ideas
    like a personal knowledge base.
  category: Productivity
  tags:
  - desktop
  - kasm
  - kasmvnc
  - linux
  - productivity
  homepageURL: https://kasm.com/images
  imageHomepageURL: https://hub.docker.com/r/kasmweb/obsidian
  icon: https://registry.kasmweb.com/1.1/icons/obsidian.png
  sourceURL: https://github.com/kasmtech/workspaces-images/blob/develop/dockerfile-kasm-obsidian
