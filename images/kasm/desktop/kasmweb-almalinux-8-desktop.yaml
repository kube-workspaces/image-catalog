apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-almalinux-8-desktop
spec:
  image: kasmweb/almalinux-8-desktop:1.19.0
  defaultCredentials:
    username: kasm_user
    password: password
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  defaultSharedMemory: true
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultShell: /bin/bash
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  displayName: AlmaLinux 8
  description: AlmaLinux is a free and open source Linux distribution, created originally
    by CloudLinux to provide a community-supported, production-grade enterprise operating
    system that is binary-compatible with Red Hat Enterprise Linux.
  category: Desktop
  tags:
  - desktop
  - development
  - kasm
  - kasmvnc
  - linux
  - productivity
  homepageURL: https://kasm.com/images
  imageHomepageURL: https://hub.docker.com/r/kasmweb/almalinux-8-desktop
  icon: https://registry.kasmweb.com/1.1/icons/almalinux.svg
  sourceURL: https://github.com/kasmtech/workspaces-images/blob/develop/dockerfile-kasm-almalinux-8-desktop
