apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-rhel-9-desktop
spec:
  image: kasmweb/rhel-9-desktop:1.19.0
  defaultCredentials:
    username: kasm_user
    password: password
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  defaultSharedMemory: true
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultShell: /bin/bash
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  displayName: RHEL 9
  description: Red Hat Enterprise Linux 9 (RHEL 9) is a Linux distribution developed by Red
    Hat, Inc., a subsidiary of IBM. It is designed for the commercial market and is known
    for its stability, security, and support.
  category: Desktop
  tags:
  - desktop
  - development
  - kasm
  - kasmvnc
  - linux
  - productivity
  homepageURL: https://kasm.com/images
  imageHomepageURL: https://hub.docker.com/r/kasmweb/rhel-9-desktop
  icon: https://registry.kasmweb.com/1.1/icons/redhat.svg
  sourceURL: https://github.com/kasmtech/workspaces-images/blob/develop/dockerfile-kasm-rhel-9-desktop
