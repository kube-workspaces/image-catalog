apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-blender
spec:
  image: kasmweb/blender:1.19.0
  defaultCredentials:
    username: kasm_user
    password: password
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  defaultSharedMemory: true
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultShell: /bin/bash
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  displayName: Blender
  description: Blender is the Free and Open Source 3D creation suite. It supports the entirety
    of the 3D pipeline modeling, sculpting, rigging, 3D and 2D animation, simulation, rendering,
    compositing, motion tracking and video editing.
  category: Tool
  tags:
  - desktop
  - development
  - kasm
  - kasmvnc
  - linux
  - multimedia
  homepageURL: https://kasm.com/images
  imageHomepageURL: https://hub.docker.com/r/kasmweb/blender
  icon: https://registry.kasmweb.com/1.1/icons/blender.png
  sourceURL: https://github.com/kasmtech/workspaces-images/blob/develop/dockerfile-kasm-blender
