apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-tracelabs-debian
spec:
  image: kasmweb/tracelabs-debian:develop
  defaultCredentials:
    username: kasm_user
    password: password
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  defaultSharedMemory: true
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultShell: /bin/bash
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  defaultImagePullPolicy: Always
  displayName: Trace Labs - Debian
  description: Trace Labs OSINT Image Based on Debian for Kasm Workspaces
  category: Productivity
  tags:
  - desktop
  - kasm
  - kasmvnc
  - linux
  - productivity
  homepageURL: https://kasm.com/images
  imageHomepageURL: https://hub.docker.com/r/kasmweb/tracelabs-debian
  icon: https://registry.kasmweb.com/1.1/icons/tracelabs.svg
  sourceURL: https://github.com/kasmtech/workspaces-images/blob/develop/dockerfile-kasm-tracelabs-debian
