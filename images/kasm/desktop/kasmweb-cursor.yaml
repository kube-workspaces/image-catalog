apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-cursor
spec:
  image: kasmweb/cursor:1.19.0-rolling-daily
  defaultCredentials:
    username: kasm_user
    password: password
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  defaultSharedMemory: true
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultShell: /bin/bash
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  defaultImagePullPolicy: Always
  displayName: Cursor
  description: Cursor - AI-powered code editor with built-in assistance and an autonomous
    coding agent
  category: IDE
  tags:
  - desktop
  - kasm
  - kasmvnc
  - linux
  homepageURL: https://kasm.com/images
  imageHomepageURL: https://hub.docker.com/r/kasmweb/cursor
  icon: https://kasm.com/assets/images/logo.svg
  sourceURL: https://github.com/kasmtech/workspaces-images
