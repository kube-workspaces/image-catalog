apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-cyberbro
spec:
  image: kasmweb/cyberbro:1.19.0
  defaultCredentials:
    username: kasm_user
    password: password
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  defaultSharedMemory: true
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultShell: /bin/bash
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  displayName: Cyberbro
  description: Cyberbro is a cybersecurity analysis tool that extracts your IoCs from garbage
    input and checks their reputation using multiple CTI services.
  category: Tool
  tags:
  - desktop
  - kasm
  - kasmvnc
  - linux
  - security
  homepageURL: https://kasm.com/images
  imageHomepageURL: https://hub.docker.com/r/kasmweb/cyberbro
  icon: https://registry.kasmweb.com/1.1/icons/cyberbro.png
  sourceURL: https://github.com/kasmtech/workspaces-images/blob/develop/dockerfile-kasm-cyberbro
