apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasm-desktop-deluxe
spec:
  defaultCredentials:
    password: password
    username: kasm_user
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  description: Ubuntu productivity desktop for Kasm Workspaces
  category: Desktop
  tags:
  - desktop
  - kasm
  - kasmvnc
  - linux
  - ubuntu
  - vnc
  displayName: Ubuntu Desktop Deluxe
  homepageURL: https://kasm.com/images
  icon: https://registry.kasmweb.com/1.1/icons/ubuntu.png
  image: kasmweb/desktop-deluxe:1.19.0
  imageHomepageURL: https://hub.docker.com/r/kasmweb/desktop-deluxe
  privileged: true
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  sourceURL: https://github.com/kasmtech/workspaces-images/blob/develop/dockerfile-kasm-desktop-deluxe
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultSharedMemory: true
  defaultShell: /bin/bash
