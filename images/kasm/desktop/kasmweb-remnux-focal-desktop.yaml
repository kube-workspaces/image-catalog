apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-remnux-focal-desktop
spec:
  image: kasmweb/remnux-focal-desktop:1.16.1
  defaultCredentials:
    username: kasm_user
    password: password
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  defaultSharedMemory: true
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultShell: /bin/bash
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  displayName: REMnux Focal
  description: Remnux Focal desktop for Kasm Workspaces
  category: Desktop
  tags:
  - desktop
  - kasm
  - kasmvnc
  - linux
  homepageURL: https://kasm.com/images
  imageHomepageURL: https://hub.docker.com/r/kasmweb/remnux-focal-desktop
  icon: https://registry.kasmweb.com/1.1/icons/remnux.png
  sourceURL: https://github.com/kasmtech/workspaces-images
