apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-opensuse-16-desktop
spec:
  image: kasmweb/opensuse-16-desktop:1.19.0
  defaultCredentials:
    username: kasm_user
    password: password
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  defaultSharedMemory: true
  defaultUser: kasm_user
  defaultHomedir: /home/kasm-user
  defaultShell: /bin/bash
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  displayName: OpenSUSE Leap 16
  description: OpenSUSE Leap is a new type of hybrid Linux distribution based on SUSE Linux
    Enterprise.
  category: Desktop
  tags:
  - desktop
  - development
  - kasm
  - kasmvnc
  - linux
  - productivity
  homepageURL: https://kasm.com/images
  imageHomepageURL: https://hub.docker.com/r/kasmweb/opensuse-16-desktop
  icon: https://registry.kasmweb.com/1.1/icons/opensuse.png
  sourceURL: https://github.com/kasmtech/workspaces-images/blob/develop/dockerfile-kasm-opensuse-16-desktop
