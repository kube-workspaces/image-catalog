apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: kasmweb-nessus
spec:
  image: kasmweb/nessus:1.19.0
  defaultCredentials:
    username: kasm_user
    password: password
  defaultEnv:
  - name: VNC_PW
    value: password
  defaultPath: /
  defaultPort: 6901
  defaultSharedMemory: true
  defaultUser: root
  defaultHomedir: /root
  defaultShell: /bin/bash
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
    websocketPaths:
    - /websockify
  displayName: Nessus
  description: Nessus is a proprietary vulnerability scanner developed by Tenable, Inc.
  category: Tool
  tags:
  - desktop
  - kasm
  - kasmvnc
  - linux
  - security
  homepageURL: https://kasm.com/images
  imageHomepageURL: https://hub.docker.com/r/kasmweb/nessus
  icon: https://registry.kasmweb.com/1.1/icons/nessus.svg
  sourceURL: https://github.com/kasmtech/workspaces-images/blob/develop/dockerfile-kasm-nessus
