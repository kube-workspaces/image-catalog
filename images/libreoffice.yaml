apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: libreoffice
spec:
  defaultPath: /
  defaultPort: 3000
  description: Full LibreOffice suite (Writer, Calc, Impress, Draw) in the browser
    via KasmVNC. Edit documents, spreadsheets, and presentations.
  category: Productivity
  tags:
  - office
  - documents
  displayName: LibreOffice
  homepageURL: https://www.libreoffice.org
  icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path fill="#18A303" d="M349.1 0c-5-.1-9.8 3-11.8 7.5-1.9 4.5-.8 10.1 2.7 13.5l106.4 106.6c3.4 3.4 9 4.6 13.5 2.8s7.7-6.5 7.8-11.3V12.3C467.7 5.9 461.8 0 455.2 0z"/><path fill="#18A303" d="M56.8 0C49.9.1 44.4 5.7 44.4 12.6v486.8c0 6.9 5.5 12.5 12.4 12.6h398.3c7 0 12.6-5.6 12.6-12.6V185.9c0-3.4-1.3-6.6-3.7-9L291.7 3.8c-2.3-2.4-5.6-3.8-9-3.9H56.8z"/><path fill="#fff" d="M69.4 25.2h208.1l165 165.8v295.8H69.4z"/></svg>'
  image: linuxserver/libreoffice:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/libreoffice
  sourceURL: https://github.com/linuxserver/docker-libreoffice
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  proxyConfig:
    needsNoopSW: true
    preservePathPrefix: true
  defaultUser: abc
  defaultHomedir: /config
