apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: craft-apps
spec:
  defaultPath: /
  defaultPort: 3000
  description: ArtCraft creative suite in the browser via Selkies. Includes
    PhotoCraft, VectorCraft, FilmCraft, LightCraft, PdfCraft, EffectCraft,
    DesignCraft, and FigCraft for image, video, PDF, and design work.
  category: Productivity
  tags:
  - artcraft
  - design
  - graphics
  - video
  - pdf
  - selkies
  displayName: Craft Apps (ArtCraft)
  homepageURL: https://getartcraft.com/
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/artcraft-logo.png
  image: linuxserver/craft-apps:latest
  imageHomepageURL: https://hub.docker.com/r/linuxserver/craft-apps
  sourceURL: https://github.com/linuxserver/docker-craft-apps
  defaultSharedMemory: true
  defaultEnv:
  - name: SUBFOLDER
    value: /proxy/{{namespace}}/{{name}}/
  proxyConfig:
    needsNoopSW: true
    preservePathPrefix: true
  defaultUser: abc
  defaultHomedir: /config
  workspaceTypes:
  - container
  - scratch
