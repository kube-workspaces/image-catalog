name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo snap install yq
          sudo apt-get update && sudo apt-get install -y jq qemu-utils
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate images/*.yaml
        run: scripts/validate.sh

      - name: Build dist artifacts
        run: scripts/build.sh

      - name: Windows bootstrap and disk packaging regression tests
        run: python3 -m unittest discover -s windows11 -p 'test_*.py'

      - name: Parse all Windows guest scripts
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          foreach ($script in Get-ChildItem "$PWD/windows11" -Filter '*.ps1') {
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors; exit 1 }
          }
