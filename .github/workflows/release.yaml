name: Release

# Cut a release: validate, tag, build the dist artifacts, publish.
#
# Run from the Actions tab with the version to release. The dist artifacts
# (images.yaml and images-examples.yaml) are attached to the GitHub Release so
# downstream repositories (e.g. kube-workspaces/deploy) can vendor a pinned
# version without a runtime dependency on this repo.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.3.0'
        type: string
        required: true
      dry_run:
        description: 'Print the notes without tagging or publishing'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the notes are generated from the commit range since the
          # previous tag.
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo snap install yq
          sudo apt-get update && sudo apt-get install -y jq

      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a vX.Y.Z version"
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi

      - name: Validate the catalog
        run: scripts/validate.sh

      - name: Build dist artifacts
        run: scripts/build.sh

      # The generator lives in the deploy repo so all kube-workspaces
      # repositories classify commits the same way.
      - name: Fetch the release-notes generator
        run: |
          curl -fsSLo /tmp/release-notes.sh \
            https://raw.githubusercontent.com/kube-workspaces/deploy/main/scripts/release-notes.sh
          chmod +x /tmp/release-notes.sh

      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          # --version, not just --to HEAD: the notes quote the version in the
          # upgrade command, and "HEAD" is not installable.
          /tmp/release-notes.sh \
            --repo "${GITHUB_REPOSITORY##*/}" \
            --from "$(git describe --tags --abbrev=0 2>/dev/null || echo HEAD)" \
            --to HEAD --version "${{ inputs.version }}" > /tmp/preamble.md
          cat /tmp/preamble.md

      - name: Summary
        run: |
          {
            echo "### Release notes preview for ${{ inputs.version }}"
            echo
            cat /tmp/preamble.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the tag and release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

          # --generate-notes appends the categorised commit list, grouped per
          # .github/release.yml, beneath our preamble.
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file /tmp/preamble.md \
            --generate-notes \
            --verify-tag \
            dist/images.yaml dist/images-examples.yaml

      - name: Dry run notice
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::dry run — nothing was tagged or published. Re-run with dry_run=false to release."
